global
    daemon
    maxconn 8192                          # Tăng max connections
    log stdout local0 info
    tune.ssl.default-dh-param 2048
    nbthread 4                            # Use 4 threads for better performance

defaults
    mode tcp
    timeout connect 10000ms               # Tăng connection timeout
    timeout client 60000ms                # Tăng client timeout  
    timeout server 60000ms                # Tăng server timeout
    timeout check 5000ms                  # Health check timeout
    option tcplog
    log global
    retries 5                             # Tăng số lần retry
    option redispatch
    balance roundrobin                    # Load balancing algorithm

# CQL Load Balancer - Primary Datacenter (Write operations)
frontend cassandra_frontend
    bind *:9142
    mode tcp
    option tcplog
    maxconn 2048                          # Max connections for this frontend
    default_backend cassandra_primary

# Primary datacenter backend (DC1) - Optimized for writes
backend cassandra_primary
    mode tcp
    balance roundrobin
    option tcp-check
    tcp-check connect
    
    # Cassandra cluster nodes with improved health checks
    server node1 cassandra-node1:9042 check inter 3000ms rise 2 fall 3 weight 100 maxconn 512
    server node2 cassandra-node2:9042 check inter 3000ms rise 2 fall 3 weight 100 maxconn 512
    server node3 cassandra-node3:9042 check inter 3000ms rise 2 fall 3 weight 100 maxconn 512

# Read-only backend for analytics (optimized for read operations)
frontend cassandra_readonly_frontend
    bind *:9143
    mode tcp
    option tcplog
    maxconn 1024                          # Dedicated connections for reads
    default_backend cassandra_readonly

backend cassandra_readonly
    mode tcp
    balance leastconn                     # Use least connections for reads
    option tcp-check
    tcp-check connect
    
    # Cassandra cluster nodes for read operations with higher connection limits
    server node1 cassandra-node1:9042 check inter 3000ms rise 2 fall 3 weight 100 maxconn 256
    server node2 cassandra-node2:9042 check inter 3000ms rise 2 fall 3 weight 100 maxconn 256
    server node3 cassandra-node3:9042 check inter 3000ms rise 2 fall 3 weight 100 maxconn 256

# Disaster recovery backend - using same cluster nodes with conservative settings
frontend cassandra_dr_frontend
    bind *:9144
    mode tcp
    option tcplog
    maxconn 512                           # Lower connections for DR
    default_backend cassandra_dr

backend cassandra_dr
    mode tcp
    balance roundrobin
    option tcp-check
    tcp-check connect
    
    # Cassandra cluster nodes (fallback configuration) with conservative health checks
    server node1 cassandra-node1:9042 check inter 10000ms rise 3 fall 5 weight 100 maxconn 128
    server node2 cassandra-node2:9042 check inter 10000ms rise 3 fall 5 weight 100 maxconn 128
    server node3 cassandra-node3:9042 check inter 10000ms rise 3 fall 5 weight 100 maxconn 128

# HAProxy statistics
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE
    stats auth admin:secure_password_2025
    stats hide-version

# Health check endpoint
listen health_check
    bind *:8405
    mode http
    monitor-uri /health
    option httplog
